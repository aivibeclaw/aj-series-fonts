<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Priority 01: AJ Shresti System/Translation/Subtitle Default + AJ Sahasvi Serif + AJ Talin Cursive -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>AJ Shresti</family>
      <family>AJ Anushya</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>AJ Shresti</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>AJ Shresti</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>AJ Sahasvi</family>
    </prefer>
  </alias>
  <alias>
    <family>ui-serif</family>
    <prefer>
      <family>AJ Sahasvi</family>
    </prefer>
  </alias>
  <alias>
    <family>cursive</family>
    <prefer>
      <family>AJ Talin</family>
    </prefer>
  </alias>
  <!-- libass / Video Subtitles / WebVTT / Chromium Translation generic aliases -->
  <alias>
    <family>subtitles</family>
    <prefer>
      <family>AJ Shresti</family>
    </prefer>
  </alias>
  <alias>
    <family>captions</family>
    <prefer>
      <family>AJ Shresti</family>
    </prefer>
  </alias>
  <alias>
    <family>libass</family>
    <prefer>
      <family>AJ Shresti</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test qual="any" name="family"><string>Ubuntu</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AJ Shresti</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Cantarell</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AJ Shresti</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AJ Shresti</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AJ Shresti</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
