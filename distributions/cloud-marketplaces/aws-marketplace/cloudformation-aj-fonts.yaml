AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AJ Series & Aaahhh Fonts Vibe (v3.0.0) — Enterprise Typography CDN & Sound-of-Font Smart Phonetic API
  Copyright (c) 2026 Aravind Jayamohan, India. Published by Aivibe Software Services Private Limited.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    schemaVersion: 1
    history:
      - timestamp: '2026-11-26T17:25:00Z'
        summary: Wire ContainerImageUri into ECS Fargate service, ALB, S3 OAC bucket policy, and CloudFront CDN distribution with secure defaults.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
  ContainerImageUri:
    Type: String
    Description: ECR URI for Aivibe Sound-of-Font & 5-Family Font Server
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Target VPC ID for the Sound-of-Font ECS Fargate service and Application Load Balancer
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets for the HTTPS/HTTP Application Load Balancer
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the ECS Fargate tasks
  AllowedAlbIngressCidr:
    Type: String
    Default: 10.0.0.0/8
    Description: Scoped CIDR allowed to reach the Sound-of-Font ALB origin directly

Resources:
  FontAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 31536000

  FontAssetsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${EnvironmentName}-aj-fonts-oac'
        Description: CloudFront OAC for AJ Series & Aaahhh Fonts Vibe v3.0.0 S3 assets
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SoundOfFontLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}-aj-series-sound-of-font'
      RetentionInDays: 30

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  SoundOfFontCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-aj-series-fonts-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Scoped ingress for AJ Series Sound-of-Font ALB origin
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedAlbIngressCidr

  FargateServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic to Sound-of-Font Fargate tasks exclusively from ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  SoundOfFontLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets: !Ref PublicSubnetIds

  SoundOfFontTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30

  SoundOfFontListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref SoundOfFontLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref SoundOfFontTargetGroup

  SoundOfFontTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-aj-series-sound-of-font'
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: sound-of-font-api
          Image: !Ref ContainerImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: !Ref EnvironmentName
            - Name: AJ_FONTS_VERSION
              Value: '3.0.0'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref SoundOfFontLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  SoundOfFontService:
    Type: AWS::ECS::Service
    DependsOn: SoundOfFontListener
    Properties:
      Cluster: !Ref SoundOfFontCluster
      TaskDefinition: !Ref SoundOfFontTaskDefinition
      DesiredCount: 2
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref FargateServiceSecurityGroup
          Subnets: !Ref PrivateSubnetIds
      LoadBalancers:
        - ContainerName: sound-of-font-api
          ContainerPort: 8080
          TargetGroupArn: !Ref SoundOfFontTargetGroup

  TypographyResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${EnvironmentName}-aj-fonts-cors-security-headers'
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items: ['*']
          AccessControlAllowMethods:
            Items: [GET, HEAD, OPTIONS]
          AccessControlAllowOrigins:
            Items: ['*']
          OriginOverride: true
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true

  TypographyCdnDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Comment: AJ Series & Aaahhh Fonts Vibe v3.0.0 Enterprise CDN + Sound-of-Font API
        Origins:
          - Id: S3FontAssetsOrigin
            DomainName: !GetAtt FontAssetsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FontAssetsOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: SoundOfFontApiOrigin
            DomainName: !GetAtt SoundOfFontLoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3FontAssetsOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref TypographyResponseHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: SoundOfFontApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref TypographyResponseHeadersPolicy

  FontAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FontAssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceHttpsTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FontAssetsBucket.Arn
              - !Sub '${FontAssetsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowCloudFrontOacReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FontAssetsBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${TypographyCdnDistribution}'

Outputs:
  BucketName:
    Description: Encrypted S3 origin bucket for AJ Series & Aaahhh Fonts Vibe v3.0.0 binaries
    Value: !Ref FontAssetsBucket
  EcsServiceArn:
    Description: Sound-of-Font ECS Fargate Service ARN running ContainerImageUri
    Value: !Ref SoundOfFontService
  CloudFrontDomainName:
    Description: Global CloudFront CDN & Sound-of-Font API domain name
    Value: !GetAtt TypographyCdnDistribution.DomainName
